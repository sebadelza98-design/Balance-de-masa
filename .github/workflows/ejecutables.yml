name: Ejecutables de la calculadora de emisiones

# Genera los ejecutables para Windows, Linux y macOS. Se ejecuta a mano desde
# la pestaña Actions (Run workflow) o al publicar una etiqueta v*.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar las pruebas
        run: python -m unittest discover -s tests -t . -v

  construir:
    name: Ejecutable ${{ matrix.nombre }}
    needs: pruebas
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nombre: Windows
            artefacto: CalculadoraEmisiones-Windows
            ruta: dist/CalculadoraEmisiones.exe
          - so: ubuntu-latest
            nombre: Linux
            artefacto: CalculadoraEmisiones-Linux
            ruta: dist/CalculadoraEmisiones
          - so: macos-latest
            nombre: macOS
            artefacto: CalculadoraEmisiones-macOS
            ruta: dist/CalculadoraEmisiones

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Construir el ejecutable
        run: python herramientas/construir.py

      - name: Comprobar que el ejecutable responde
        shell: bash
        run: |
          "${{ matrix.ruta }}" --version
          "${{ matrix.ruta }}" factores --alcance 1 | head -20

      - name: Publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.ruta }}
          if-no-files-found: error
          retention-days: 30
